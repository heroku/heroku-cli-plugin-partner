name: tests
on:
  push:
    branches-ignore: [main]
  workflow_dispatch:

jobs:
  unit-tests:
    strategy:
      matrix:
        node_version: ['20.x', '22.x']
        os: ['sfdc-hk-ubuntu-latest', 'sfdc-hk-macos-latest', 'sfdc-hk-windows-latest']
      fail-fast: false
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node_version }}
          cache: yarn
      - run: yarn
      - run: yarn build
      - run: yarn test
